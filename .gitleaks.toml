# Extends the default gitleaks rules. Only narrow, documented allowlists go here.
[extend]
useDefault = true

[[allowlists]]
description = "Buf Schema Registry module references (buf.build/owner/module:<32-hex commit>) are public commit ids, not secrets"
regexTarget = "line"
regexes = ['''buf\.build/[a-z0-9-]+/[a-z0-9-]+:[0-9a-f]{32}''']

[[allowlists]]
description = "buf.lock holds public dependency digests generated by buf"
paths = ['''^contracts/buf\.lock$''']
