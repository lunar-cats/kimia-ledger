info:
    title: Kimia Ledger API
    description: |-
        Kimia Ledger API, version 1. Served over gRPC and, via gRPC-JSON transcoding, over HTTPS/JSON on the
         paths given by the google.api.http options (ADR 0004).

         Cross-cutting rules:
           - Authentication: OAuth2 client-credentials JWT in the `authorization` metadata / `Authorization: Bearer`
             header, over mTLS. The tenant is a claim of that token. There is no tenant field anywhere in this API (I-19).
           - Scopes: CreateAccount `accounts:write`; GetAccount `accounts:read`; PostEntry `entries:write`;
             GetEntry `entries:read`; GetBalance `balances:read`; ListPostings `postings:read`.
           - Idempotency: every write takes an `idempotency_key` (1-255 chars, caller-chosen, unique per tenant).
             Retrying with the same key and payload returns the original result and sets `idempotent_replay` (I-15).
           - Correlation: every request may carry a `correlation_id` (<= 128 chars); the server generates one if
             absent and echoes it in every response and every ErrorInfo.
           - Errors: gRPC status with a `ledger.v1.ErrorInfo` detail; REST returns the google.rpc.Status JSON
             shape with the same ErrorInfo inside `details`. Branch on ErrorInfo.code.
           - Limits: request body <= 256 KiB; postings per entry 2..100; page_size 1..1000 (default 100).
    version: v1
