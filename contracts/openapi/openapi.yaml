                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
    /v1/accounts/{accountId}/postings:
        get:
            tags:
                - LedgerService
            description: Lists postings of an account in journal order (ascending sequence_no), paginated.
            operationId: LedgerService_ListPostings
            parameters:
                - name: accountId
