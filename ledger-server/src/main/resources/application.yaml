spring:
  application:
    name: kimia-ledger

server:
  port: 8080

# Only /health is exposed for now (actuator health remapped to the root path).
management:
  endpoints:
    web:
      base-path: /
      exposure:
        include: health
      path-mapping:
        health: health
  endpoint:
    health:
      probes:
        enabled: true
